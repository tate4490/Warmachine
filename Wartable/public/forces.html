<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wartable — Build a Force</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    html, body { overflow: hidden; height: 100%; }

    /* ─── App shell ─────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ─── Top bar ───────────────────────────────────────────── */
    #top-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 44px;
      padding: 0 12px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #top-bar a, #top-bar button { flex-shrink: 0; }
    #home-link {
      padding: 2px 8px;
      font-size: 11px;
      color: var(--text-muted);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg-panel2);
    }
    #home-link:hover { color: var(--text); border-color: var(--border-light); }
    #bar-title { font-size: 14px; font-weight: 700; color: var(--accent); margin-right: 4px; }
    #bar-right  { margin-left: auto; display: flex; align-items: center; gap: 8px; }

    #force-name-wrap { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
    #force-name-input {
      flex: 1; min-width: 120px; max-width: 260px;
      font-size: 14px; font-weight: 600;
      background: transparent; border: 1px solid transparent;
      border-radius: 4px; padding: 3px 6px; color: var(--text);
    }
    #force-name-input:focus { background: var(--bg-panel2); border-color: var(--accent2); }
    #bar-army-mt {
      font-size: 11px; color: var(--text-dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px;
    }
    #bar-pts { font-size: 13px; font-weight: 700; font-family: var(--font-mono); color: var(--accent); white-space: nowrap; }
    #bar-pts.over { color: var(--danger); }

    /* ─── Sort bar (list mode) ──────────────────────────────── */
    #sort-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px;
      background: var(--bg-panel); border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    #sort-bar label { font-size: 11px; color: var(--text-muted); }
    #sort-select { width: auto; font-size: 12px; padding: 4px 6px; }
    #sort-bar .count { margin-left: auto; font-size: 11px; color: var(--text-muted); }

    /* ─── List view ─────────────────────────────────────────── */
    #list-view { flex: 1; overflow-y: auto; }
    #list-scroll { padding: 16px; }
    #forces-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }
    #no-data-msg { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    #no-data-msg .no-data-icon { font-size: 36px; margin-bottom: 12px; }
    #no-data-msg p { font-size: 13px; line-height: 1.7; }

    .force-group-header {
      grid-column: 1 / -1;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted); padding: 8px 4px 2px;
      border-bottom: 1px solid var(--border); margin-top: 8px;
    }
    .force-group-header:first-child { margin-top: 0; }

    .force-card {
      background: var(--bg-panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px;
      display: flex; flex-direction: column; gap: 6px;
      position: relative; transition: border-color 0.15s;
    }
    .force-card:hover { border-color: var(--border-light); }
    .fc-arena  { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); }
    .fc-army   { font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-leader-row { display: flex; align-items: baseline; gap: 6px; }
    .fc-leader-name { font-size: 14px; color: var(--text); font-weight: 600; }
    .fc-leader-type { font-size: 10px; color: var(--text-muted); }
    .fc-divider { height: 1px; background: var(--border); margin: 2px 0; }
    .fc-match  { font-size: 11px; color: var(--text-dim); }
    .fc-pts    { font-size: 12px; font-family: var(--font-mono); color: var(--text); }
    .fc-pts .pts-num   { font-weight: 700; color: var(--accent2); }
    .fc-pts .pts-limit { color: var(--text-muted); }
    .fc-meta   { font-size: 10px; color: var(--text-muted); }
    .fc-actions { display: flex; gap: 6px; margin-top: 4px; }
    .fc-actions .btn { flex: 1; font-size: 12px; }

    /* ─── Builder view — 3-column ───────────────────────────── */
    #builder-view { flex: 1; display: flex; overflow: hidden; }

    /* Left: unit browser */
    #unit-browser {
      width: 260px; flex-shrink: 0;
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--bg-panel); overflow: hidden;
    }
    #browser-config {
      padding: 10px;
      display: flex; flex-direction: column; gap: 6px;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }

    /* Edition / filter controls */
    .edition-row {
      display: flex; gap: 12px; align-items: center;
    }
    .edition-radio {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 600; color: var(--text);
      cursor: pointer; user-select: none;
    }
    .edition-radio input[type="radio"] { accent-color: var(--accent); cursor: pointer; }
    .option-row {
      display: flex; align-items: center;
    }
    .option-row label {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--text-muted); cursor: pointer; user-select: none;
    }
    .option-row input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; }

    .config-row { display: flex; gap: 6px; }
    .config-row select { flex: 1; font-size: 12px; }
    #browser-search { font-size: 12px; }

    /* Browser list */
    #browser-list {
      flex: 1; overflow-y: auto; padding: 4px 0;
      display: flex; flex-direction: column;
    }
    .browser-section-hdr {
      display: flex; align-items: center; gap: 4px;
      font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 8px 10px 4px;
      cursor: pointer; user-select: none;
      border-top: 1px solid var(--border);
    }
    .browser-section-hdr:first-child { border-top: none; }
    .browser-section-hdr:hover { color: var(--text); }
    .bsh-label { flex: 1; }
    .bsh-count { font-size: 9px; color: var(--text-muted); }
    .bsh-toggle { font-size: 10px; color: var(--text-muted); transition: transform 0.15s; }
    .browser-section-hdr.collapsed .bsh-toggle { transform: rotate(-90deg); }

    .browser-unit {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 10px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .browser-unit:hover    { background: var(--bg-panel2); }
    .browser-unit.selected { background: rgba(201,170,113,0.12); }
    .browser-unit.in-force { opacity: 0.55; }
    .bu-dot  { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .bu-name { flex: 1; font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bu-cost { font-size: 11px; font-family: var(--font-mono); color: var(--text-dim); min-width: 28px; text-align: right; }
    .bu-cost.free { color: var(--accent); }
    .bu-add {
      padding: 2px 6px; font-size: 10px; font-weight: 700;
      background: var(--bg-panel2); border: 1px solid var(--border-light);
      border-radius: 3px; color: var(--text-dim);
      cursor: pointer; flex-shrink: 0; transition: all 0.1s;
    }
    .bu-add:hover:not(:disabled) { background: var(--accent2); border-color: var(--accent2); color: #fff; }
    .bu-add:disabled { opacity: 0.35; cursor: default; }
    .bu-add.is-leader { background: rgba(201,170,113,0.15); border-color: var(--accent); color: var(--accent); }
    #browser-empty {
      text-align: center; padding: 24px 12px;
      color: var(--text-muted); font-size: 12px; line-height: 1.7;
    }
    .browser-no-mercs {
      padding: 4px 10px 8px;
      font-size: 11px; color: var(--text-muted); font-style: italic;
    }

    /* ─── Center: card detail ───────────────────────────────── */
    #card-detail {
      width: 320px; flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex; flex-direction: column;
      background: var(--bg-app);
    }
    .cd-close-row {
      display: flex; justify-content: flex-end;
      padding: 6px 8px 0;
      flex-shrink: 0;
    }
    .cd-close-btn {
      background: none; border: none;
      color: var(--text-muted); cursor: pointer;
      font-size: 14px; padding: 2px 6px; border-radius: 3px;
    }
    .cd-close-btn:hover { color: var(--text); background: var(--bg-panel2); }

    .cd-header {
      padding: 4px 12px 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .cd-name {
      font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.3;
    }
    .cd-type-cost {
      display: flex; align-items: center; gap: 8px;
      margin-top: 3px;
    }
    .cd-type-label { font-size: 11px; color: var(--text-muted); flex: 1; }
    .cd-cost-label { font-size: 11px; font-weight: 700; color: var(--accent2); font-family: var(--font-mono); }
    .cd-fa         { font-size: 10px; color: var(--text-muted); padding: 1px 5px; border: 1px solid var(--border); border-radius: 3px; }
    .cd-keywords {
      display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px;
    }
    .cd-kw {
      font-size: 9px; padding: 1px 5px;
      background: var(--bg-panel); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text-muted);
    }

    /* Stat bar */
    .cd-stats-row {
      display: flex; gap: 0;
      background: var(--bg-panel); border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .cd-stat {
      flex: 1; text-align: center;
      padding: 7px 2px;
      border-right: 1px solid var(--border);
    }
    .cd-stat:last-child { border-right: none; }
    .cd-stat-label { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .cd-stat-val   { font-size: 14px; font-weight: 700; color: var(--text); font-family: var(--font-mono); margin-top: 2px; }
    .cd-stat-pip .cd-stat-val { color: var(--accent); }

    .cd-info-row {
      display: flex; gap: 6px; flex-wrap: wrap;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .cd-info-chip {
      font-size: 10px; padding: 2px 7px;
      background: var(--bg-panel); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text-dim);
    }

    /* Sections (weapons, abilities, options) */
    .cd-section { border-bottom: 1px solid var(--border); padding: 8px 12px; }
    .cd-section-hdr {
      font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted); margin-bottom: 6px;
    }

    .cd-weapon { margin-bottom: 6px; }
    .cd-weapon:last-child { margin-bottom: 0; }
    .cd-weapon-hdr {
      display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap;
    }
    .cd-weapon-icon { font-size: 11px; flex-shrink: 0; }
    .cd-weapon-name { font-size: 12px; font-weight: 600; color: var(--text); }
    .cd-weapon-stats { font-size: 11px; color: var(--accent2); font-family: var(--font-mono); margin-left: auto; }
    .cd-weapon-props { font-size: 10px; color: var(--text-muted); margin-top: 2px; padding-left: 16px; font-style: italic; }

    .cd-ability { margin-bottom: 6px; }
    .cd-ability:last-child { margin-bottom: 0; }
    .cd-ability-name { font-size: 12px; font-weight: 600; color: var(--text); }
    .cd-ability-text { font-size: 11px; color: var(--text-muted); line-height: 1.5; margin-top: 2px; }

    .cd-option { font-size: 11px; color: var(--text-dim); padding: 2px 0; }

    .cd-feat-name { font-size: 12px; font-weight: 600; color: var(--accent); }
    .cd-feat-text { font-size: 11px; color: var(--text-muted); line-height: 1.5; margin-top: 2px; }

    /* Card detail footer */
    .cd-footer {
      padding: 10px 12px;
      margin-top: auto;
      flex-shrink: 0;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
    }
    .cd-add-btn { width: 100%; }

    /* ─── Right: force roster ───────────────────────────────── */
    #force-roster { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 220px; }
    #roster-setup {
      padding: 10px 14px; border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px;
      flex-shrink: 0; background: var(--bg-panel);
    }
    .setup-row   { display: flex; gap: 8px; }
    .setup-row select { flex: 1; font-size: 12px; }
    .setup-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }

    #roster-body {
      flex: 1; overflow-y: auto; padding: 10px 14px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .roster-section-hdr {
      font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted); padding-top: 8px;
    }
    .roster-section-hdr:first-child { padding-top: 0; }
    .roster-card {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px;
      background: var(--bg-panel2); border: 1px solid var(--border);
      border-radius: 5px;
    }
    .roster-card.leader-card { background: rgba(201,170,113,0.08); border-color: rgba(201,170,113,0.35); }
    .rc-dot   { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .rc-name  { font-size: 12px; color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rc-type  { font-size: 10px; color: var(--text-muted); }
    .rc-cost  { font-size: 11px; font-family: var(--font-mono); color: var(--text-dim); min-width: 32px; text-align: right; flex-shrink: 0; }
    .rc-cost.free-cost { color: var(--accent); font-size: 10px; }
    .rc-remove {
      background: none; border: none; color: var(--text-muted);
      cursor: pointer; font-size: 13px; line-height: 1; padding: 0 2px; flex-shrink: 0;
    }
    .rc-remove:hover { color: var(--danger); }
    .roster-empty {
      text-align: center; padding: 10px; color: var(--text-muted);
      font-size: 11px; font-style: italic;
    }

    #roster-footer {
      padding: 10px 14px; border-top: 1px solid var(--border);
      background: var(--bg-panel); flex-shrink: 0;
      display: flex; flex-direction: column; gap: 6px;
    }
    .pts-bar-wrap    { display: flex; align-items: center; gap: 10px; }
    .pts-bar-label   { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
    .pts-bar-track   { flex: 1; height: 6px; background: var(--bg-panel2); border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
    .pts-bar-fill    { height: 100%; background: var(--accent2); border-radius: 3px; transition: width 0.2s, background 0.2s; }
    .pts-bar-fill.over { background: var(--danger); }
    .pts-bar-num     { font-size: 12px; font-family: var(--font-mono); color: var(--text); flex-shrink: 0; }
    .pts-bar-num.over { color: var(--danger); }
    .roster-footer-actions { display: flex; gap: 8px; }
    .roster-footer-actions .btn { flex: 1; }
  </style>
</head>
<body>

<div id="app">

  <!-- ═══ TOP BAR ═══ -->
  <div id="top-bar">
    <a id="home-link" href="/home.html">⌂ Home</a>

    <span id="bar-title" data-list>Build a Force</span>
    <div id="bar-right">
      <button id="new-force-btn" class="btn btn-primary btn-sm" data-list>+ New Force</button>

      <div id="force-name-wrap" data-builder hidden>
        <button id="back-btn" class="btn btn-sm">← Forces</button>
        <input id="force-name-input" placeholder="Force name…" maxlength="60" autocomplete="off" />
        <span id="bar-army-mt"></span>
      </div>
      <span id="bar-pts" data-builder hidden>0 pts</span>
      <button id="save-btn"   class="btn btn-primary btn-sm"  data-builder hidden>Save</button>
      <button id="delete-btn" class="btn btn-sm btn-danger"   data-builder hidden>Delete</button>
    </div>
  </div>

  <!-- ═══ LIST VIEW ═══ -->
  <div id="list-view">
    <div id="sort-bar">
      <label for="sort-select">Sort:</label>
      <select id="sort-select">
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
        <option value="army-pts-asc">Army → Points ↑</option>
        <option value="army-pts-desc">Army → Points ↓</option>
        <option value="leader-pts-asc">Leader → Points ↑</option>
        <option value="leader-pts-desc">Leader → Points ↓</option>
        <option value="pts-asc">Points ↑ → Army</option>
        <option value="pts-desc">Points ↓ → Army</option>
      </select>
      <span id="force-count" class="count"></span>
    </div>
    <div id="list-scroll">
      <div id="forces-grid"></div>
      <div id="no-data-msg" hidden>
        <div class="no-data-icon">🛡</div>
        <p id="no-data-text">No saved forces found.</p>
      </div>
    </div>
  </div>

  <!-- ═══ BUILDER VIEW ═══ -->
  <div id="builder-view" hidden>

    <!-- Left: unit browser -->
    <div id="unit-browser">
      <div id="browser-config">

        <!-- Edition filter -->
        <div class="edition-row">
          <label class="edition-radio">
            <input type="radio" name="edition" value="mkiv" checked> MKIV
          </label>
          <label class="edition-radio">
            <input type="radio" name="edition" value="legacy"> Legacy
          </label>
        </div>
        <div id="legends-row" class="option-row">
          <label><input type="checkbox" id="legends-cb"> Include Legends</label>
        </div>
        <div class="option-row">
          <label><input type="checkbox" id="mercs-cb"> Show Mercenaries</label>
        </div>

        <!-- Army -->
        <div class="config-row">
          <select id="army-select"><option value="">— All Armies —</option></select>
        </div>

        <!-- Search -->
        <input id="browser-search" type="text" placeholder="Search units…" autocomplete="off" />
      </div>

      <div id="browser-list">
        <div id="browser-empty" class="muted-text">Select an army to browse units.</div>
      </div>
    </div>

    <!-- Center: card detail (shown when a unit is selected) -->
    <div id="card-detail" hidden></div>

    <!-- Right: force roster -->
    <div id="force-roster">
      <div id="roster-setup">
        <div class="setup-label">Force Setup</div>
        <div id="setup-info" style="font-size:12px;color:var(--text-muted);">
          Select an army and match type to get started.
        </div>
        <select id="matchtype-select" style="font-size:12px;"><option value="">— Match Type —</option></select>
      </div>
      <div id="roster-body"></div>
      <div id="roster-footer">
        <div class="pts-bar-wrap">
          <span class="pts-bar-label">Points</span>
          <div class="pts-bar-track"><div class="pts-bar-fill" id="pts-bar" style="width:0%"></div></div>
          <span class="pts-bar-num" id="pts-num">0 / 0</span>
        </div>
        <div class="roster-footer-actions">
          <button id="save-btn-footer"   class="btn btn-primary">Save Force</button>
          <button id="delete-btn-footer" class="btn btn-danger" hidden>Delete Force</button>
        </div>
      </div>
    </div>

  </div><!-- #builder-view -->
</div><!-- #app -->

<script type="module" src="/js/forces.js"></script>
</body>
</html>
